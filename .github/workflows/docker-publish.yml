name: 每日检查并按需发布 Docker 镜像

on:
  schedule:
    # GitHub Actions cron 使用 UTC，对应北京时间每天 01:30。
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 仅构建、扫描和 smoke，不创建正式发布状态
        type: boolean
        required: true
        default: true

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.plan.outputs.should_publish }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      latest_tag: ${{ steps.plan.outputs.latest_tag }}
      version: ${{ steps.plan.outputs.version }}
      image_repo: ${{ steps.plan.outputs.image_repo }}
      metadata_blob: ${{ steps.plan.outputs.metadata_blob }}
      check_reason: ${{ steps.plan.outputs.check_reason }}
    steps:
      - name: 检出发布源提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: 计算发布计划
        id: plan
        shell: bash
        env:
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          IMAGE_REPO_CONFIG: ${{ vars.IMAGE_REPO || vars.DEFAULT_IMAGE_REPO }}
        run: |
          set -euo pipefail

          source_sha="${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "releases must run from refs/heads/main" >&2
            exit 1
          fi

          git fetch origin main --tags
          remote_main="$(git rev-parse origin/main)"
          if [[ "${remote_main}" != "${source_sha}" || "$(git rev-parse HEAD)" != "${source_sha}" ]]; then
            echo "release source is no longer the current main commit" >&2
            exit 1
          fi

          image_repo="${IMAGE_REPO_CONFIG}"
          if [[ -z "${image_repo}" || "${image_repo}" =~ [[:space:]@] ]]; then
            echo "set a valid IMAGE_REPO or DEFAULT_IMAGE_REPO GitHub Variable" >&2
            exit 1
          fi

          dry_run="false"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_DRY_RUN}" != "false" ]]; then
            dry_run="true"
          fi

          latest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          metadata_blob=""
          metadata_version=""
          metadata_source=""
          metadata_digest=""
          if git cat-file -e "${source_sha}:release-metadata/version-info.json" 2>/dev/null; then
            metadata_blob="$(git rev-parse "${source_sha}:release-metadata/version-info.json")"
            metadata_json="$(git show "${source_sha}:release-metadata/version-info.json")"
            metadata_version="$(jq -r '.version // empty' <<<"${metadata_json}")"
            metadata_source="$(jq -r '.commit_sha // empty' <<<"${metadata_json}")"
            metadata_digest="$(jq -r '.image_digest // empty' <<<"${metadata_json}")"
          fi

          recovering="false"
          if [[ -n "${latest_tag}" ]]; then
            latest_source="$(git rev-parse "refs/tags/${latest_tag}^{}")"
            latest_version="${latest_tag#v}"
            if [[ "${latest_source}" == "${source_sha}" ]] \
              && [[ "${metadata_version}" != "${latest_version}" \
                || "${metadata_source}" != "${source_sha}" \
                || -z "${metadata_digest}" ]]; then
              recovering="true"
            fi
          fi

          should_publish="false"
          check_reason=""
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            should_publish="true"
            check_reason="manual validation run"
          elif [[ "${recovering}" == "true" ]]; then
            should_publish="true"
            check_reason="recovering an incomplete release for the current source"
          elif [[ -z "${latest_tag}" ]]; then
            should_publish="true"
            check_reason="first release"
          else
            commit_count="$(git rev-list --count "${latest_tag}..${source_sha}" -- . ':(exclude)release-metadata/**')"
            if [[ "${commit_count}" -gt 0 ]]; then
              should_publish="true"
              check_reason="${commit_count} releasable commit(s) found"
            else
              check_reason="no releasable commits"
            fi
          fi

          if [[ "${recovering}" == "true" ]]; then
            version="${latest_tag#v}"
          else
            if [[ -n "${latest_tag}" ]]; then
              base_version="${latest_tag#v}"
            elif [[ -f VERSION ]]; then
              base_version="$(tr -d '\r\n' < VERSION | xargs)"
            else
              base_version="0.1.0"
            fi
            if ! [[ "${base_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid base version: ${base_version}" >&2
              exit 1
            fi
            IFS='.' read -r major minor patch_version <<<"${base_version}"
            version="${major}.${minor}.$((patch_version + 1))"
          fi

          {
            echo "should_publish=${should_publish}"
            echo "dry_run=${dry_run}"
            echo "source_sha=${source_sha}"
            echo "latest_tag=${latest_tag}"
            echo "version=${version}"
            echo "image_repo=${image_repo}"
            echo "metadata_blob=${metadata_blob}"
            echo "check_reason=${check_reason}"
          } >> "${GITHUB_OUTPUT}"

  backend-gate:
    needs: plan
    if: ${{ needs.plan.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECRET_KEY: ci-test-secret-key-only-not-for-production-0123456789abcdef
    steps:
      - name: 检出发布源提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.in
            backend/requirements.txt
            backend/requirements-dev.in
            backend/requirements-dev.txt

      - name: 安装后端 hash lock
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: 运行后端发布门禁
        working-directory: backend
        run: |
          set -euo pipefail
          python -m app.openapi_export --check --output openapi.json
          python -m pytest -q
          python -m ruff check app tests
          python -m black --check app tests
          python -m mypy
          python -m compileall -q app
          python -m pip_audit -r requirements.txt

  frontend-gate:
    needs: plan
    if: ${{ needs.plan.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出发布源提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端 lockfile
        working-directory: frontend
        run: npm ci

      - name: 运行前端发布门禁
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run api:check:types
          npm run api:check:ownership
          npm run lint
          npm run type-check
          npm run test:unit
          npm run build
          npm audit --omit=dev --audit-level=high
          npx playwright install --with-deps chromium
          npm run test:e2e

  release-gate:
    needs: [plan, backend-gate, frontend-gate]
    if: ${{ needs.plan.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 确认同源质量门
        run: echo "quality gate passed for ${{ needs.plan.outputs.source_sha }}"

  validate-credentials:
    needs: [plan, release-gate]
    if: ${{ needs.plan.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 校验 registry 凭据与正式 tag 写入边界
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG_WRITER_EXCLUSIVE: ${{ vars.RELEASE_TAG_WRITER_EXCLUSIVE }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "Docker Hub credentials are missing" >&2
            exit 1
          fi
          if [[ "${{ needs.plan.outputs.dry_run }}" != "true" \
            && "${RELEASE_TAG_WRITER_EXCLUSIVE}" != "true" ]]; then
            echo "formal release requires RELEASE_TAG_WRITER_EXCLUSIVE=true" >&2
            exit 1
          fi

  capture-baseline:
    needs: [plan, validate-credentials]
    if: ${{ needs.plan.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      baseline_mode: ${{ steps.capture.outputs.baseline_mode }}
      previous_version: ${{ steps.capture.outputs.previous_version }}
      previous_source_sha: ${{ steps.capture.outputs.previous_source_sha }}
      previous_digest: ${{ steps.capture.outputs.previous_digest }}
      previous_latest_digest: ${{ steps.capture.outputs.previous_latest_digest }}
      metadata_blob: ${{ steps.capture.outputs.metadata_blob }}
    steps:
      - name: 检出发布源提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: 配置 Docker Buildx
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: 登录 Docker Hub
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 捕获并验证前一正式状态
        id: capture
        shell: bash
        env:
          IMAGE_REPO: ${{ needs.plan.outputs.image_repo }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          EXPECTED_METADATA_BLOB: ${{ needs.plan.outputs.metadata_blob }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          LATEST_TAG: ${{ needs.plan.outputs.latest_tag }}
        run: |
          set -euo pipefail

          if [[ "${DRY_RUN}" == "true" ]]; then
            {
              echo "baseline_mode=dry-run"
              echo "previous_version="
              echo "previous_source_sha="
              echo "previous_digest="
              echo "previous_latest_digest="
              echo "metadata_blob=${EXPECTED_METADATA_BLOB}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          digest_re='^sha256:[0-9a-f]{64}$'
          inspect_digest() {
            local manifest
            manifest="$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null)" || return 1
            jq -er '.digest' <<<"${manifest}" | grep -E "${digest_re}"
          }
          verify_provenance() {
            local ref="$1" expected_source="$2" expected_version="$3" mode="$4"
            local manifest platform_matrix provenance
            manifest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}')"
            platform_matrix="$(jq -ce '
              [.manifests[]
               | select(.platform.os != "unknown" or .platform.architecture != "unknown")
               | {platform: (.platform.os + "/" + .platform.architecture), digest: .digest}]
            ' <<<"${manifest}")"
            jq -e --arg mode "${mode}" '
              [.[].platform] as $platforms
              | ([.[].digest] | unique | length) == length
              and all(.[].digest; test("^sha256:[0-9a-f]{64}$"))
              and if $mode == "normal" then
                    ($platforms | sort) == ["linux/amd64", "linux/arm64"]
                  else
                    (($platforms | length) >= 1)
                    and all($platforms[]; . == "linux/amd64" or . == "linux/arm64")
                  end
            ' <<<"${platform_matrix}" >/dev/null
            jq -e --argjson platforms "${platform_matrix}" '
              [$platforms[].digest] as $image_digests
              | [.manifests[]
                 | select(.platform.os == "unknown" and .platform.architecture == "unknown")
                 | .annotations] as $attestations
              | ($attestations | length) == ($image_digests | length)
              and ([$attestations[]
                    | select(."vnd.docker.reference.type" == "attestation-manifest")
                    | ."vnd.docker.reference.digest"] | sort) == ($image_digests | sort)
              and (.manifests | length) == (($image_digests | length) * 2)
            ' <<<"${manifest}" >/dev/null

            provenance="$(docker buildx imagetools inspect \
              "${ref}" --format '{{json .Provenance}}')"
            jq -e \
              --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
              --arg source "${expected_source}" \
              --arg version "${expected_version}" \
              --argjson platforms "${platform_matrix}" '
              def valid_slsa:
                .buildDefinition.buildType
                  == "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md"
                and .buildDefinition.externalParameters.request.args["build-arg:APP_VERSION"]
                  == $version
                and .buildDefinition.externalParameters.request.root.configSource.request.args["vcs:source"]
                  == $repository
                and .buildDefinition.externalParameters.request.root.configSource.request.args["vcs:revision"]
                  == $source
                and .runDetails.metadata.vcs.source == $repository
                and .runDetails.metadata.vcs.revision == $source;
              [$platforms[].platform] as $expected_platforms
              | if has("SLSA") then
                  ($expected_platforms | length) == 1 and (.SLSA | valid_slsa)
                else
                  (keys | sort) == ($expected_platforms | sort)
                  and all(.[]; has("SLSA") and (.SLSA | valid_slsa))
                end
            ' <<<"${provenance}" >/dev/null
          }

          git fetch origin main --tags
          metadata_blob=""
          metadata_json=""
          if git cat-file -e "origin/main:release-metadata/version-info.json" 2>/dev/null; then
            metadata_blob="$(git rev-parse "origin/main:release-metadata/version-info.json")"
            metadata_json="$(git show "origin/main:release-metadata/version-info.json")"
          fi
          if [[ "${metadata_blob}" != "${EXPECTED_METADATA_BLOB}" ]]; then
            echo "metadata blob changed before baseline capture" >&2
            exit 1
          fi

          previous_latest_digest=""
          previous_latest_digest="$(inspect_digest "${IMAGE_REPO}:latest")" || true
          previous_version=""
          previous_source_sha=""
          previous_digest=""
          baseline_mode="empty"

          metadata_digest="$(jq -r '.image_digest // empty' <<<"${metadata_json:-{}}")"
          if [[ -n "${metadata_digest}" ]]; then
            baseline_mode="normal"
            previous_version="$(jq -er '.version' <<<"${metadata_json}")"
            previous_source_sha="$(jq -er '.commit_sha' <<<"${metadata_json}")"
            previous_digest="${metadata_digest}"
            if ! [[ "${previous_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ \
              && "${previous_source_sha}" =~ ^[0-9a-f]{40}$ \
              && "${previous_digest}" =~ ${digest_re} ]]; then
              echo "normal baseline metadata is invalid" >&2
              exit 1
            fi
            tag_source="$(git rev-parse "refs/tags/v${previous_version}^{}")"
            version_digest="$(inspect_digest "${IMAGE_REPO}:${previous_version}")"
            if [[ "${tag_source}" != "${previous_source_sha}" \
              || "${version_digest}" != "${previous_digest}" ]]; then
              echo "normal baseline identity mismatch" >&2
              exit 1
            fi
            verify_provenance "${IMAGE_REPO}@${previous_digest}" \
              "${previous_source_sha}" "${previous_version}" "normal"
          elif [[ -n "${metadata_json}" ]]; then
            baseline_mode="legacy"
            if [[ -z "${LATEST_TAG}" ]]; then
              echo "legacy baseline requires a SemVer Git tag" >&2
              exit 1
            fi
            previous_version="${LATEST_TAG#v}"
            previous_source_sha="$(git rev-parse "refs/tags/${LATEST_TAG}^{}")"
            previous_digest="$(inspect_digest "${IMAGE_REPO}:${previous_version}")"
            if [[ -z "${previous_latest_digest}" \
              || "${previous_digest}" != "${previous_latest_digest}" ]]; then
              echo "legacy baseline version/latest mismatch" >&2
              exit 1
            fi
            verify_provenance "${IMAGE_REPO}@${previous_digest}" \
              "${previous_source_sha}" "${previous_version}" "legacy"
          elif [[ -n "${previous_latest_digest}" ]]; then
            echo "first release requires latest to be absent" >&2
            exit 1
          fi

          {
            echo "baseline_mode=${baseline_mode}"
            echo "previous_version=${previous_version}"
            echo "previous_source_sha=${previous_source_sha}"
            echo "previous_digest=${previous_digest}"
            echo "previous_latest_digest=${previous_latest_digest}"
            echo "metadata_blob=${metadata_blob}"
          } >> "${GITHUB_OUTPUT}"

  build-candidate:
    needs: [plan, capture-baseline]
    if: ${{ needs.plan.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      manifest_digest: ${{ steps.verify.outputs.manifest_digest }}
      platform_matrix: ${{ steps.verify.outputs.platform_matrix }}
    env:
      BUILDX_GIT_LABELS: full
    steps:
      - name: 检出发布源提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: 登录 Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建一次多平台候选镜像
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./deploy/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: mode=max
          tags: ${{ needs.plan.outputs.image_repo }}:build-${{ needs.plan.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          build-args: APP_VERSION=${{ needs.plan.outputs.version }}

      - name: 校验 manifest、平台、OCI labels 与 provenance
        id: verify
        shell: bash
        env:
          IMAGE_REPO: ${{ needs.plan.outputs.image_repo }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          ACTION_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest_re='^sha256:[0-9a-f]{64}$'
          candidate_ref="${IMAGE_REPO}:build-${SOURCE_SHA}"
          if ! [[ "${ACTION_DIGEST}" =~ ${digest_re} ]]; then
            echo "build action returned an invalid manifest digest" >&2
            exit 1
          fi

          manifest="$(docker buildx imagetools inspect \
            "${candidate_ref}" --format '{{json .Manifest}}')"
          manifest_digest="$(jq -er '.digest' <<<"${manifest}")"
          if [[ "${manifest_digest}" != "${ACTION_DIGEST}" ]]; then
            echo "candidate tag digest differs from the build output" >&2
            exit 1
          fi

          platform_matrix="$(jq -ce '
            [.manifests[]
             | select(.platform.os != "unknown" or .platform.architecture != "unknown")
             | {platform: (.platform.os + "/" + .platform.architecture), digest: .digest}]
          ' <<<"${manifest}")"
          jq -e '
            length == 2
            and ([.[].platform] | sort == ["linux/amd64", "linux/arm64"])
            and ([.[].digest] | unique | length == 2)
            and all(.[].digest; test("^sha256:[0-9a-f]{64}$"))
          ' <<<"${platform_matrix}" >/dev/null
          jq -e --argjson platforms "${platform_matrix}" '
            [$platforms[].digest] as $image_digests
            | [.manifests[]
               | select(.platform.os == "unknown" and .platform.architecture == "unknown")
               | .annotations] as $attestations
            | ($attestations | length) == 2
            and ([$attestations[]
                  | select(."vnd.docker.reference.type" == "attestation-manifest")
                  | ."vnd.docker.reference.digest"] | sort) == ($image_digests | sort)
            and (.manifests | length) == 4
          ' <<<"${manifest}" >/dev/null

          provenance="$(docker buildx imagetools inspect \
            "${candidate_ref}" --format '{{json .Provenance}}')"
          jq -e \
            --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
            --arg source "${SOURCE_SHA}" \
            --arg version "${VERSION}" \
            --argjson platforms "${platform_matrix}" '
            def valid_slsa:
              .buildDefinition.buildType
                == "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md"
              and .buildDefinition.externalParameters.request.args["build-arg:APP_VERSION"]
                == $version
              and .buildDefinition.externalParameters.request.root.configSource.request.args["vcs:source"]
                == $repository
              and .buildDefinition.externalParameters.request.root.configSource.request.args["vcs:revision"]
                == $source
              and .runDetails.metadata.vcs.source == $repository
              and .runDetails.metadata.vcs.revision == $source;
            (keys | sort) == ([$platforms[].platform] | sort)
            and all(.[]; has("SLSA") and (.SLSA | valid_slsa))
          ' <<<"${provenance}" >/dev/null

          while IFS=$'\t' read -r platform platform_digest; do
            labels="$(docker buildx imagetools inspect \
              "${IMAGE_REPO}@${platform_digest}" --format '{{json .Image.Config.Labels}}')"
            jq -e \
              --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
              --arg source "${SOURCE_SHA}" \
              --arg version "${VERSION}" \
              '."org.opencontainers.image.source" == $repository
               and ."org.opencontainers.image.revision" == $source
               and ."org.opencontainers.image.version" == $version' \
              <<<"${labels}" >/dev/null

            echo "verified ${platform} ${platform_digest}"
          done < <(jq -r '.[] | [.platform, .digest] | @tsv' <<<"${platform_matrix}")

          {
            echo "manifest_digest=${manifest_digest}"
            echo "platform_matrix=${platform_matrix}"
          } >> "${GITHUB_OUTPUT}"

  scan-platform:
    needs: [plan, build-candidate]
    if: ${{ needs.plan.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build-candidate.outputs.platform_matrix) }}
    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trivy 阻断扫描 ${{ matrix.platform }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.plan.outputs.image_repo }}@${{ matrix.digest }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          version: v0.73.0

      - name: 记录 Trivy 与数据库版本
        shell: bash
        run: |
          {
            echo "## Trivy scan"
            echo "- platform: ${{ matrix.platform }}"
            echo "- digest: ${{ matrix.digest }}"
            echo '```json'
            trivy version --format json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  smoke-candidate:
    needs: [plan, build-candidate]
    if: ${{ needs.plan.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出发布源提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: 登录 Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 运行候选 digest smoke
        shell: bash
        run: >-
          deploy/scripts/smoke_release_image.sh
          "${{ needs.plan.outputs.image_repo }}@${{ needs.build-candidate.outputs.manifest_digest }}"

  candidate-verified:
    needs: [plan, build-candidate, scan-platform, smoke-candidate]
    if: ${{ needs.plan.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 记录候选验证结果
        run: |
          {
            echo "## Candidate verified"
            echo "- source: ${{ needs.plan.outputs.source_sha }}"
            echo "- digest: ${{ needs.build-candidate.outputs.manifest_digest }}"
            echo "- dry-run: ${{ needs.plan.outputs.dry_run }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  release-state-gate:
    needs: [plan, capture-baseline, build-candidate, candidate-verified]
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出远端 metadata 基线
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0

      - name: 在不可逆操作前复核基线
        shell: bash
        env:
          BASELINE_MODE: ${{ needs.capture-baseline.outputs.baseline_mode }}
          PREVIOUS_DIGEST: ${{ needs.capture-baseline.outputs.previous_digest }}
          PREVIOUS_LATEST_DIGEST: ${{ needs.capture-baseline.outputs.previous_latest_digest }}
          TARGET_DIGEST: ${{ needs.build-candidate.outputs.manifest_digest }}
          METADATA_BLOB: ${{ needs.capture-baseline.outputs.metadata_blob }}
        run: |
          set -euo pipefail
          case "${BASELINE_MODE}" in
            normal|legacy)
              if [[ "${PREVIOUS_LATEST_DIGEST}" != "${PREVIOUS_DIGEST}" \
                && "${PREVIOUS_LATEST_DIGEST}" != "${TARGET_DIGEST}" ]]; then
                echo "latest does not match the previous or recovering target digest" >&2
                exit 1
              fi
              ;;
            empty)
              if [[ -n "${PREVIOUS_LATEST_DIGEST}" \
                && "${PREVIOUS_LATEST_DIGEST}" != "${TARGET_DIGEST}" ]]; then
                echo "first release found an unrelated latest digest" >&2
                exit 1
              fi
              ;;
            *)
              echo "invalid formal baseline mode" >&2
              exit 1
              ;;
          esac

          git fetch origin main
          current_blob=""
          if git cat-file -e "origin/main:release-metadata/version-info.json" 2>/dev/null; then
            current_blob="$(git rev-parse "origin/main:release-metadata/version-info.json")"
          fi
          if [[ "${current_blob}" != "${METADATA_BLOB}" ]]; then
            echo "metadata blob changed before formal promotion" >&2
            exit 1
          fi

  promote-version:
    needs: [plan, build-candidate, release-state-gate]
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: 登录 Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 幂等 promotion 不可变版本 tag
        shell: bash
        env:
          IMAGE_REPO: ${{ needs.plan.outputs.image_repo }}
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET_DIGEST: ${{ needs.build-candidate.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          inspect_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null \
              | jq -er '.digest'
          }
          version_ref="${IMAGE_REPO}:${VERSION}"
          current="$(inspect_digest "${version_ref}")" || current=""
          if [[ -n "${current}" && "${current}" != "${TARGET_DIGEST}" ]]; then
            echo "version image conflict: ${version_ref} already points elsewhere" >&2
            exit 1
          fi
          if [[ "${current}" != "${TARGET_DIGEST}" ]]; then
            docker buildx imagetools create \
              --tag "${version_ref}" "${IMAGE_REPO}@${TARGET_DIGEST}"
          fi
          verified="$(inspect_digest "${version_ref}")"
          [[ "${verified}" == "${TARGET_DIGEST}" ]]

  push-git-tag:
    needs: [plan, promote-version]
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出发布源提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: 幂等创建 Git tag
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          tag="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing="$(git rev-parse "refs/tags/${tag}^{}")"
            if [[ "${existing}" != "${SOURCE_SHA}" ]]; then
              echo "Git tag conflict: ${tag} points to ${existing}" >&2
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${SOURCE_SHA}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"

  promote-latest:
    needs: [plan, capture-baseline, build-candidate, push-git-tag]
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: 登录 Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 从基线幂等推进 latest
        shell: bash
        env:
          IMAGE_REPO: ${{ needs.plan.outputs.image_repo }}
          PREVIOUS_DIGEST: ${{ needs.capture-baseline.outputs.previous_digest }}
          PREVIOUS_LATEST_DIGEST: ${{ needs.capture-baseline.outputs.previous_latest_digest }}
          TARGET_DIGEST: ${{ needs.build-candidate.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          inspect_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null \
              | jq -er '.digest'
          }
          latest_ref="${IMAGE_REPO}:latest"
          current="$(inspect_digest "${latest_ref}")" || current=""
          if [[ "${current}" == "${TARGET_DIGEST}" ]]; then
            exit 0
          fi
          if [[ "${current}" != "${PREVIOUS_LATEST_DIGEST}" ]]; then
            echo "latest changed after baseline capture" >&2
            exit 1
          fi
          if [[ "${PREVIOUS_LATEST_DIGEST}" != "${PREVIOUS_DIGEST}" ]]; then
            echo "latest baseline is not the previous formal digest" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${latest_ref}" "${IMAGE_REPO}@${TARGET_DIGEST}"
          verified="$(inspect_digest "${latest_ref}")"
          [[ "${verified}" == "${TARGET_DIGEST}" ]]

  update-metadata:
    needs: [plan, capture-baseline, build-candidate, promote-latest]
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出 main 用于乐观锁提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: 基于远端文件 blob 幂等更新 metadata
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          IMAGE_REPO: ${{ needs.plan.outputs.image_repo }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.build-candidate.outputs.manifest_digest }}
          BASELINE_BLOB: ${{ needs.capture-baseline.outputs.metadata_blob }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          target_is_current() {
            local metadata="$1"
            [[ -n "${metadata}" ]] || return 1
            jq -e \
              --arg version "${VERSION}" \
              --arg source "${SOURCE_SHA}" \
              --arg digest "${IMAGE_DIGEST}" \
              '.version == $version and .commit_sha == $source and .image_digest == $digest' \
              <<<"${metadata}" >/dev/null
          }
          read_remote_state() {
            git fetch origin main
            remote_blob=""
            remote_metadata=""
            if git cat-file -e "origin/main:release-metadata/version-info.json" 2>/dev/null; then
              remote_blob="$(git rev-parse "origin/main:release-metadata/version-info.json")"
              remote_metadata="$(git show "origin/main:release-metadata/version-info.json")"
            fi
          }
          write_commit() {
            git checkout -B release-metadata origin/main
            mkdir -p release-metadata
            build_time_beijing="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %:z')"
            build_time_iso_beijing="$(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S%:z')"
            jq -n \
              --arg version "${VERSION}" \
              --arg image_repo "${IMAGE_REPO}" \
              --arg image_digest "${IMAGE_DIGEST}" \
              --arg build_time_beijing "${build_time_beijing}" \
              --arg build_time_iso_beijing "${build_time_iso_beijing}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg commit_sha "${SOURCE_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              '{
                version: $version,
                git_tag: ("v" + $version),
                image_repo: $image_repo,
                image_tags: [($image_repo + ":" + $version), ($image_repo + ":latest")],
                image_digest: $image_digest,
                build_time_beijing: $build_time_beijing,
                build_time_iso_beijing: $build_time_iso_beijing,
                timezone: "Asia/Shanghai",
                repository: $repository,
                commit_sha: $commit_sha,
                run_id: $run_id,
                source: "github-actions"
              }' > release-metadata/version-info.json
            git add release-metadata/version-info.json
            git commit -m "chore(release): update version metadata v${VERSION} [skip ci]"
          }

          for attempt in 1 2 3; do
            read_remote_state
            if target_is_current "${remote_metadata}"; then
              exit 0
            fi
            if [[ "${remote_blob}" != "${BASELINE_BLOB}" ]]; then
              echo "metadata blob changed" >&2
              exit 1
            fi
            write_commit
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "metadata push raced with unrelated main change; retry ${attempt}/3" >&2
          done
          echo "metadata push did not converge after three attempts" >&2
          exit 1

  release-summary:
    needs: [plan, build-candidate, update-metadata]
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 输出正式发布摘要
        run: |
          {
            echo "## Release completed"
            echo "- version: v${{ needs.plan.outputs.version }}"
            echo "- source: ${{ needs.plan.outputs.source_sha }}"
            echo "- digest: ${{ needs.build-candidate.outputs.manifest_digest }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-skipped:
    needs: plan
    if: ${{ needs.plan.outputs.should_publish != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 输出跳过摘要
        run: echo "${{ needs.plan.outputs.check_reason }}" >> "${GITHUB_STEP_SUMMARY}"
