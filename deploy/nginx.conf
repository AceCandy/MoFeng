server {
    listen 6100;
    listen [::]:6100;
    server_name _;
    # 安全响应头（location 内 add_header 会覆盖 server 级，需在各 location 重复）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=5184000; includeSubDomains" always;
    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;
    # 客户端最大上传大小
    client_max_body_size 50M;
    # 解决 414 Request-URI Too Large 错误
    client_header_buffer_size 64k;
    large_client_header_buffers 4 64k;
    # API 后端代理
    location /api/ {
        proxy_pass http://127.0.0.1:6101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 超时设置 - 针对AI生成操作的长时间响应
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
        # 增加代理缓冲区大小
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    # 前端路由支持 (SPA) - 包括管理后台
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    # 静态资源缓存 - 图片和字体长期缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=5184000; includeSubDomains" always;
    }
    # JS/CSS - Vite 哈希资产长期缓存（文件名含 hash，变更自动失效）
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=5184000; includeSubDomains" always;
    }
    # 日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
